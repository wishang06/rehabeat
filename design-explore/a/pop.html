<link rel="stylesheet" href="style.css">
<style>
@property --c{syntax:'<integer>';initial-value:11;inherits:false}
@property --v{syntax:'<integer>';initial-value:0;inherits:false}
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
:root{--beat:0.8s;--loop:3.20s}
@keyframes combo-count{0%,100%{--c:12}}
.combo__n{counter-reset:c var(--c);animation:combo-count var(--loop) linear infinite}
.combo__n::after{content:counter(c)}
@keyframes a-pop{0%{visibility:visible;opacity:0;transform:scale(.7)}4%{visibility:visible;opacity:1;transform:scale(1.12)}8.5%{visibility:visible;opacity:1;transform:scale(1)}36.25%{visibility:visible;opacity:1;transform:scale(1)}47.5%{visibility:visible;opacity:0;transform:translateY(-32px)}47.510%,100%{opacity:0;visibility:hidden}}
@keyframes a-pop-bg{0%{visibility:visible;transform:scaleX(.12)}7.5%{visibility:visible;transform:scaleX(1)}47.5%{visibility:visible;transform:scaleX(1)}47.510%,100%{opacity:0;visibility:hidden}}
@keyframes a-bump{0%{visibility:visible;transform:scale(1)}3.5%{visibility:visible;transform:scale(1.2)}10.5%{visibility:visible;transform:scale(1)}10.510%,100%{transform:scale(1)}}
.pop--perfect{animation:a-pop var(--loop) linear infinite}
.pop--perfect::before{animation:a-pop-bg var(--loop) linear infinite}
.hud-combo{animation:a-bump var(--loop) linear infinite}
</style>
</head>
