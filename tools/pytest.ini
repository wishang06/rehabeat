[pytest]
# Run from the repo root:  tools\.venv\Scripts\python.exe -m pytest tools
# This file makes tools/ the pytest root, so the cache stays in tools/.pytest_cache
# and the tests can "import make_beatmap" without installing anything.
testpaths = tests
pythonpath = .
cache_dir = .pytest_cache
# librosa's fallback decoder imports stdlib modules that Python 3.13 will remove.
filterwarnings =
    ignore::DeprecationWarning:audioread.*
